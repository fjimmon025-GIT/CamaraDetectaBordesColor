<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contornos Arcoíris Alta Definición</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            /* Ajustado al 100% del ancho de la pantalla */
            width: 100vw;
            height: auto;
            filter: blur(0.35px) brightness(1.35) contrast(1.2);
        }
        video {
            display: none;
        }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById("webcam");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });

        const THRESHOLD = 24;
        const SOFT_RANGE = 18;
        const FLOW_SPEED = 3;

        let hueOffset = 0;

        // Tabla precalculada de 360 colores puros del arcoíris con luminosidad elevada
        const rainbowLUT = new Uint8Array(360 * 3);
        for (let h = 0; h < 360; h++) {
            const c = 1;
            const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
            let r = 0, g = 0, b = 0;

            if (h < 60) { r = c; g = x; b = 0; }
            else if (h < 120) { r = x; g = c; b = 0; }
            else if (h < 180) { r = 0; g = c; b = x; }
            else if (h < 240) { r = 0; g = x; b = c; }
            else if (h < 300) { r = x; g = 0; b = c; }
            else { r = c; g = 0; b = x; }

            rainbowLUT[h * 3]     = Math.min(255, Math.round((r * 0.85 + 0.15) * 255));
            rainbowLUT[h * 3 + 1] = Math.min(255, Math.round((g * 0.85 + 0.15) * 255));
            rainbowLUT[h * 3 + 2] = Math.min(255, Math.round((b * 0.85 + 0.15) * 255));
        }

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: true
            });
            video.srcObject = stream;

            video.onloadedmetadata = () => {
                video.play();
                const ratio = video.videoHeight / video.videoWidth;
                canvas.width = 1280;
                canvas.height = Math.round(1280 * ratio);
                requestAnimationFrame(processFrame);
            };
        }

        function processFrame() {
            if (video.readyState >= 2) {
                const w = canvas.width;
                const h = canvas.height;

                ctx.save();
                ctx.filter = "blur(0.8px)";
                ctx.scale(-1, 1);
                ctx.drawImage(video, -w, 0, w, h);
                ctx.restore();

                const frame = ctx.getImageData(0, 0, w, h);
                const data = frame.data;
                const output = ctx.createImageData(w, h);
                const outData = output.data;

                const gray = new Uint8Array(w * h);
                for (let i = 0, j = 0; i < data.length; i += 4, j++) {
                    gray[j] = (data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11);
                }

                hueOffset = (hueOffset + FLOW_SPEED) % 360;
                const radToDeg = 180 / Math.PI;

                for (let y = 1; y < h - 1; y++) {
                    for (let x = 1; x < w - 1; x++) {
                        const idx = y * w + x;

                        const gx =
                            -gray[idx - w - 1] + gray[idx - w + 1] +
                            -2 * gray[idx - 1] + 2 * gray[idx + 1] +
                            -gray[idx + w - 1] + gray[idx + w + 1];

                        const gy =
                            -gray[idx - w - 1] - 2 * gray[idx - w] - gray[idx - w + 1] +
                             gray[idx + w - 1] + 2 * gray[idx + w] + gray[idx + w + 1];

                        const edgeStrength = Math.abs(gx) + Math.abs(gy);
                        const outIdx = idx * 4;

                        if (edgeStrength > THRESHOLD) {
                            let rawIntensity = (edgeStrength - THRESHOLD) / SOFT_RANGE;
                            if (rawIntensity > 1) rawIntensity = 1;
                            const intensity = Math.sqrt(rawIntensity);

                            const angleDeg = Math.atan2(gy, gx) * radToDeg;
                            let hue = Math.floor(angleDeg + 180 + hueOffset) % 360;
                            if (hue < 0) hue += 360;

                            const lutIdx = hue * 3;
                            outData[outIdx]     = rainbowLUT[lutIdx] * intensity;
                            outData[outIdx + 1] = rainbowLUT[lutIdx + 1] * intensity;
                            outData[outIdx + 2] = rainbowLUT[lutIdx + 2] * intensity;
                            outData[outIdx + 3] = 255;
                        } else {
                            outData[outIdx]     = 0;
                            outData[outIdx + 1] = 0;
                            outData[outIdx + 2] = 0;
                            outData[outIdx + 3] = 255;
                        }
                    }
                }

                ctx.putImageData(output, 0, 0);
            }
            requestAnimationFrame(processFrame);
        }

        startCamera();
    </script>
</body>
</html>
